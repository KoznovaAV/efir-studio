name: EFIR tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test FFmpeg binary
        shell: bash
        run: |
          python -m pip install --only-binary=:all: imageio-ffmpeg==0.6.0
          echo "EFIR_FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Run CPU tests
        env:
          PYTHONUTF8: '1'
          EFIR_TEST_DESKTOP: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m unittest discover -s tests -v
