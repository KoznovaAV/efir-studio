workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [quality, unit, integration, e2e, coverage, package, release]

variables:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

.python:
  image: python:3.13.16-slim-trixie@sha256:cf50a4f6ac4f026458b08d5222023d700ac806410dff5e9ca8728fa44f2b850f

.test:
  extends: .python
  before_script:
    - 'pip install --only-binary=:all: unittest-xml-reporting==3.2.0'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/qa/junit/*.xml

.media:
  extends: .test
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends xvfb xauth tk
    - 'pip install --only-binary=:all: unittest-xml-reporting==3.2.0 coverage==7.13.5 imageio-ffmpeg==0.6.0'
    - export EFIR_FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" EFIR_TEST_DESKTOP=1

lint:
  extends: .python
  stage: quality
  script:
    - 'pip install --only-binary=:all: ruff==0.15.7'
    - python -m ruff check efir tests scripts
    - python -m compileall -q efir tests scripts

unit:
  extends: .test
  stage: unit
  script:
    - python -m xmlrunner discover -s tests -p test_project.py -v -o reports/qa/junit
    - python -m xmlrunner discover -s tests -p test_core_edges.py -v -o reports/qa/junit

integration:
  extends: .media
  stage: integration
  script:
    - python -m xmlrunner discover -s tests -p test_render.py -v -o reports/qa/junit
    - xvfb-run -a python -m xmlrunner discover -s tests -p test_entry_points.py -v -o reports/qa/junit
    - xvfb-run -a python -m xmlrunner discover -s tests -p test_desktop.py -v -o reports/qa/junit

e2e:
  extends: .media
  stage: e2e
  script:
    - python -m xmlrunner discover -s tests -p test_cli_e2e.py -v -o reports/qa/junit

coverage:
  extends: .media
  stage: coverage
  coverage: '/Line coverage: ([0-9.]+)%/'
  script:
    - xvfb-run -a python -m coverage run -m unittest discover -s tests -v
    - python scripts/coverage_report.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/qa/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/qa/coverage.xml

.docker:
  image: docker:29.8.0-cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
  services:
    - name: docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    HEALTHCHECK_TCP_PORT: '2375'
  before_script:
    - docker info

container:
  extends: .docker
  stage: package
  script:
    - docker build --pull --tag efir-studio:ci .
    - mkdir -p reports/docker
    - docker image inspect efir-studio:ci > reports/docker/image.json
    - docker run --rm -i --network none --entrypoint python efir-studio:ci - < tests/test_cli_e2e.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/docker/]

publish-image:
  extends: .docker
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_REGISTRY_IMAGE'
  script:
    - image="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker build --pull --tag "$image" .
    - docker run --rm -i --network none --entrypoint python "$image" - < tests/test_cli_e2e.py
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$image"
